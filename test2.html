<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nav Hover Fix</title>

    <style>
        body {
            background: #2b2b2b;
            font-family: sans-serif;
        }

        .nav {
            display: flex;
            gap: 60px;
            padding: 40px;
        }

        .nav a {
            position: relative;
            text-decoration: none;
            color: #ccc;
            font-size: 22px;
            padding: 10px 20px;
            transition: 0.3s;
        }

        /* ✅ FIXED trapezoid (top wide, bottom narrow) */
        .nav a::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 140, 0, 0.5), transparent);

            /* 🔥 corrected shape */
            clip-path: polygon(0% 0%, 100% 0%, 70% 100%, 30% 100%);

            opacity: 0;
            transition: 0.3s;
        }

        /* underline */
        .nav a::after {
            content: "";
            position: absolute;
            left: 30%;
            bottom: 0;
            width: 40%;
            height: 2px;
            background: orange;
            transform: scaleX(0);
            transition: 0.3s;
        }

        .nav a:hover,
        .nav a.active {
            color: #ff8c00;
        }

        .nav a:hover::before,
        .nav a.active::before {
            opacity: 1;
        }

        .nav a:hover::after,
        .nav a.active::after {
            transform: scaleX(1);
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="#" class="active">Home</a>
        <a href="#">Projects</a>
    </div>

</body>

</html>
